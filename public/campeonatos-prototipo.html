<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ômega Bot — Protótipo de Campeonatos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#313338;color:#f2f3f5;font:15px system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.nav{background:#2b2d31;padding:24px 14px}.brand{font-size:18px;font-weight:800;margin:0 8px 22px}.nav button{border:0;background:transparent;color:#b5bac1;text-align:left;width:100%;padding:11px;border-radius:6px;font-size:14px}.nav button:hover,.nav button.active{background:#404249;color:white}.main{max-width:900px;width:100%;margin:0 auto;padding:42px 28px}.discord{background:#2b2d31;border-radius:9px;border-left:4px solid #5865f2;padding:18px 20px;box-shadow:0 6px 18px #0003}.gold{border-color:#ffd700}.orange{border-color:#ff8c00}.title{font-weight:800;font-size:19px}.muted{color:#b5bac1;line-height:1.5}.button{padding:10px 14px;border:0;border-radius:5px;background:#5865f2;color:#fff;font-weight:700;margin:8px 6px 0 0}.success{background:#23a559}.danger{background:#da373c}.secondary{background:#4e5058}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.card{background:#383a40;border:1px solid #4e5058;padding:13px;border-radius:7px}.card.ok{border-color:#23a559}.select{display:block;width:100%;margin-top:9px;padding:11px;border:0;border-radius:5px;background:#1e1f22;color:#ddd}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.channel{color:#b5bac1;padding:7px}.channel b{color:#f2f3f5}.vs{margin-top:14px}.pill{background:#23a559;color:#fff;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:800}@media(max-width:620px){.app{grid-template-columns:1fr}.nav{display:flex;overflow:auto;padding:8px}.nav button{min-width:max-content}.brand{display:none}.main{padding:20px 14px}.cards,.cols{grid-template-columns:1fr}}
</style>
<body><div class="app"><nav class="nav"><div class="brand">🏆 Ômega Bot</div><button class="active" data-v="painel">/painel</button><button data-v="wizard">Wizard</button><button data-v="canais">Canais</button><button data-v="inscricoes">Inscrições</button><button data-v="admin">Painel Admin</button><button data-v="partidas">Partidas</button></nav><main class="main" id="view"></main></div>
<script>
const views={
painel:`<section class="discord gold"><div class="title">🏆 Central de Campeonatos</div><p class="muted">Crie e gerencie campeonatos em 2 minutos.</p><button class="button success" onclick="go('wizard')">＋ Criar Novo Campeonato</button><p class="muted">Ômega Bot • Painel fixo</p></section>`,
wizard:`<section class="discord"><div class="title">⚙️ Opções do Campeonato — Etapa 1/2</div><p>●━━○ <b>Etapa 1 de 2</b></p><div class="cards"><div class="card ok">⚔️ <b>Modo</b><br><small>✅ Duelos (1v1)</small></div><div class="card ok">🏆 <b>Ranks</b><br><small>✅ Ômega, Champion (2)</small></div><div class="card">⏱️ <b>Simultaneidade</b><br><small>Simultâneas</small></div><div class="card">👥 <b>Entrada</b><br><small>Definir limite</small></div></div><select class="select" multiple><option selected>Ômega</option><option selected>Champion</option><option>Diamond</option></select><button class="button">Continuar</button><button class="button danger">Cancelar</button></section>`,
canais:`<section class="discord"><div class="title">🏆 TESTE1 — Ômega #2</div><p class="channel">📢・<b>avisos</b></p><p class="channel">📝・<b>inscricoes</b></p><p class="channel">🔧・<b>painel-org</b></p><p class="channel">⚔️・<b>quartas</b></p><p class="channel">⚔️・<b>semis</b></p><p class="channel">🏆・<b>final</b></p></section>`,
inscricoes:`<section class="discord"><div class="title">🟢 Inscrições Abertas — Ômega #2</div><div class="cols"><p><b>TESTE1</b><br>1v1 • Fixa<br><span class="muted">Inscreva seu time para participar.</span></p><p><b>0/8 times</b><br>░░░░░░░░<br><span class="muted">8 vagas disponíveis</span></p></div><button class="button success">✅ Inscrever meu time</button><button class="button secondary">🛠️ Pedir inscrição manual</button></section>`,
admin:`<section class="discord orange"><div class="title">🛠️ Painel do Organizador</div><p><span class="pill">🟢 INSCRIÇÕES ABERTAS • 0 times</span></p><button class="button">📊 Classificação</button><button class="button">👥 Gerenciar Times</button><br><button class="button secondary">⚔️ Gerar Partidas</button><button class="button secondary">🔒 Encerrar Inscrições</button><br><button class="button secondary">📣 Broadcast</button><br><button class="button secondary">⚙️ Editar</button><button class="button success">🏁 Finalizar</button><button class="button danger">⛔ Cancelar</button></section>`,
partidas:`<section class="discord"><div class="title">⚔️・Quartas</div><article class="discord vs"><div class="title">🕒 Partida #1 — 20:00 — MD3</div><p><b>Ômega Esport</b> &nbsp; VS &nbsp; <b>Phoenix</b><br><span class="muted">@jogador1 @jogador2 • ⏳ Aguardando • Sala: /sala 3</span></p><button class="button">📸 Enviar Print</button><button class="button danger">⚠️ Reportar WO</button><button class="button secondary">💬 Abrir Thread</button></article></section>`};
function go(n){document.getElementById('view').innerHTML=views[n];document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===n))}document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>go(x.dataset.v));go('painel');
</script></body></html>
